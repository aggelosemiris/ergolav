var DAYS=["Πέμ 29/10","Παρ 30/10","Σάβ 31/10","Δευ 2/11 · νέοι"];
var NEWNOTE="Νέοι από όλη την Αθήνα, με σειρά καταλληλότητας: κάνουν ανακαίνιση μπάνιου (εκεί γράφουν προσφορά με υλικά), έχουν κινητό με όνομα ιδιοκτήτη (σηκώνει και αποφασίζει ο ίδιος), και οι περισσότεροι έχουν site (πιο εύκολα δοκιμάζουν μια εφαρμογή). Πηγή: vrisko.gr.";

// Όλες οι επαφές σε μία λίστα
var ALL=[];
CALLS.forEach(function(r,d){r.forEach(function(l,i){var p=l.split("|");ALL.push({id:d+"-"+i,mode:"c",day:d,i:i,name:p[0],addr:p[1],tel:p[2],t:p[3],extra:p[4]||"",owner0:PEOPLE[i%3]})})});
VISITS.forEach(function(r,d){r.forEach(function(v,i){ALL.push({id:v.id,mode:"v",day:d,i:i,name:v.name,addr:v.addr,tel:v.tel||"",t:v.t,when:v.when,ch:v.ch,plan:v.plan})})});
function isSup(c){return c.t==="π"}
function owner(c){var o=st(c.id).o;return PEOPLE.indexOf(o)>=0?o:c.owner0}

// ── Κατάσταση ──
var K="ergolav-calls-v1",KV="ergolav-crm-view",S={},view={mode:"v",who:"all",day:0,p:"all"},col=null,timers={},dirty=false;
try{S=JSON.parse(localStorage.getItem(K)||"{}")||{}}catch(e){S={}}
try{var vv=JSON.parse(localStorage.getItem(KV)||"null");if(vv&&vv.mode){view=vv;if(!view.p)view.p="all"}}catch(e){}
function saveView(){try{localStorage.setItem(KV,JSON.stringify(view))}catch(e){}}
function saveLocal(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function st(id){return S[id]||(S[id]={s:0,n:"",o:""})}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function setSync(t){document.getElementById("sync").textContent=t}
function push(id){
  saveLocal();
  if(!col)return;
  var x=st(id);
  col.doc(id).set({s:x.s||0,n:x.n||"",o:x.o||"",at:Date.now()}).then(function(){setSync("αποθηκεύτηκε")},function(){setSync("δεν αποθηκεύτηκε, ξαναδοκίμασε")});
}

function match(c){return c.mode===view.mode&&(view.who==="all"||(view.who==="sup")===isSup(c))&&(c.mode==="v"||view.p==="all"||owner(c)===view.p)}
function labels(c){
  if(c.mode==="c")return["Θέλει","Αργότερα","Όχι","Δεν σήκωσε"];
  if(c.ch==="m")return["Θέλει","Αργότερα","Όχι","Δεν απάντησε"];
  return["Θέλει","Αργότερα","Όχι","Δεν βρέθηκε"];
}

function header(){
  var nv=ALL.filter(function(c){return c.mode==="v"}).length,nc=ALL.length-nv;
  document.getElementById("seg").innerHTML='<button data-mode="v" aria-pressed="'+(view.mode==="v")+'">Από κοντά · '+nv+'</button><button data-mode="c" aria-pressed="'+(view.mode==="c")+'">Τηλέφωνα · '+nc+'</button>';
  var pe=document.getElementById("people");
  if(view.mode==="c"){pe.hidden=false;pe.innerHTML=[["all","Όλοι"]].concat(PEOPLE.map(function(n){return[n,n]})).map(function(w){var cnt=w[0]==="all"?"":" · "+ALL.filter(function(c){return c.mode==="c"&&owner(c)===w[0]}).length;return'<button data-p="'+w[0]+'" aria-pressed="'+(view.p===w[0])+'">'+w[1]+cnt+"</button>"}).join("")}
  else{pe.hidden=true;pe.innerHTML=""}
  document.getElementById("chips").innerHTML=[["all","Όλοι"],["pro","Μάστορες"],["sup","Προμηθευτές"]].map(function(w){return'<button data-who="'+w[0]+'" aria-pressed="'+(view.who===w[0])+'">'+w[1]+"</button>"}).join("");
  document.getElementById("days").innerHTML=DAYS.slice(0,view.mode==="v"?3:4).map(function(t,d){var r=ALL.filter(function(c){return match(c)&&c.day===d}),done=r.filter(function(c){return st(c.id).s}).length,yes=r.filter(function(c){return st(c.id).s==1}).length;
    return'<button data-day="'+d+'" aria-pressed="'+(view.day===d)+'">'+t+"<small>"+done+"/"+r.length+" · "+yes+" θέλουν</small></button>"}).join("");
  var all=ALL.filter(match),cnt=[0,0,0,0,0];all.forEach(function(c){cnt[st(c.id).s||0]++});
  document.getElementById("sum").innerHTML="Σύνολο: <b>"+(all.length-cnt[0])+"/"+all.length+"</b> έγιναν · <b>"+cnt[1]+"</b> θέλουν · <b>"+cnt[2]+"</b> αργότερα · <b>"+cnt[3]+"</b> όχι"+(view.mode==="v"?" · <b>πάτε και οι τρεις</b>":"");
}

function cardHTML(c,showWhen){
  var x=st(c.id),tel=c.tel.replace(/\s/g,""),h='<div class="row" data-s="'+x.s+'"><div class="top">';
  if(showWhen)h+='<div class="when">'+esc(c.when)+"</div>";
  h+='<div class="who"><div class="name">'+esc(c.name)+'<span class="badge'+(isSup(c)?" sup":"")+'">'+(isSup(c)?"Προμηθευτής":(c.mode==="v"?"Μάστορας · ":"")+T[c.t])+"</span></div>";
  if(tel)h+='<div class="tel"><a href="tel:+30'+tel+'">'+esc(c.tel)+'</a><button class="copy" data-copy="'+tel+'">Αντιγραφή</button></div>';
  var addr=esc(c.addr);
  if(c.mode==="v"&&c.ch==="v")addr='<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.addr)+'" target="_blank" rel="noopener">'+addr+"</a>";
  h+='<div class="meta">'+addr+(c.extra?" · "+esc(c.extra):"")+"</div>";
  if(c.plan)h+='<div class="plan">'+esc(c.plan)+"</div>";
  if(c.mode==="c"){var o=owner(c);h+='<label class="own">Παίρνει:<select data-o="'+c.id+'" id="o-'+c.id+'">'+PEOPLE.map(function(n){return'<option'+(n===o?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label>'}
  else h+='<div class="together">Άγγελος, Φίλιππος, Θάνος: πάτε μαζί</div>';
  h+='</div></div><div class="btns">';
  labels(c).forEach(function(l,k){var v=k+1;h+='<button data-id="'+c.id+'" data-v="'+v+'" aria-pressed="'+(x.s==v)+'">'+l+"</button>"});
  h+='</div><input id="n-'+c.id+'" data-n="'+c.id+'" placeholder="Σημείωση: τι είπε, νούμερο, πότε να ξαναπάρω" value="'+esc(x.n)+'"></div>';
  return h;
}

function render(){
  if(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.n){dirty=true;return}
  dirty=false;if(view.mode==="v"&&view.day>2)view.day=0;header();
  var rows=ALL.filter(function(c){return match(c)&&c.day===view.day}),h="";
  if(view.mode==="v"){
    if(DAYNOTE[view.day])h+='<div class="daynote">'+esc(DAYNOTE[view.day])+"</div>";
    rows.forEach(function(c){h+=cardHTML(c,true)});
  }else{
    if(view.day===3)h+='<div class="daynote">'+esc(NEWNOTE)+"</div>";
    rows.forEach(function(c,k){if(view.p==="all"&&k%3==0)h+="<h2>Σετ "+(k/3+1)+"</h2>";h+=cardHTML(c,false)});
  }
  if(!rows.length)h='<div class="empty">'+(view.who==="sup"&&view.mode==="c"?"Δεν υπάρχουν προμηθευτές στη λίστα τηλεφώνων.":"Τίποτα για αυτή τη μέρα με αυτά τα φίλτρα.")+"</div>";
  document.getElementById("list").innerHTML=h;
}
function rerender(){var y=window.scrollY;render();window.scrollTo(0,y)}

document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.copy){var t=b.dataset.copy;var ok=function(){b.textContent="Αντιγράφηκε";setTimeout(function(){b.textContent="Αντιγραφή"},1500)};
    try{navigator.clipboard.writeText(t).then(ok,function(){b.textContent=t})}catch(_){b.textContent=t}return}
  if(b.dataset.mode){view.mode=b.dataset.mode;saveView();render();window.scrollTo(0,0)}
  else if(b.dataset.p){view.p=b.dataset.p;saveView();render();window.scrollTo(0,0)}
  else if(b.dataset.who){view.who=b.dataset.who;saveView();render()}
  else if(b.dataset.day!==undefined){view.day=+b.dataset.day;saveView();render();window.scrollTo(0,0)}
  else if(b.dataset.id){var x=st(b.dataset.id);x.s=x.s==b.dataset.v?0:+b.dataset.v;push(b.dataset.id);rerender()}
});
document.addEventListener("change",function(e){var id=e.target.dataset&&e.target.dataset.o;if(!id)return;st(id).o=e.target.value;push(id);rerender()});
document.addEventListener("input",function(e){var id=e.target.dataset.n;if(!id)return;st(id).n=e.target.value;saveLocal();clearTimeout(timers[id]);timers[id]=setTimeout(function(){delete timers[id];push(id)},900)});
document.addEventListener("focusout",function(e){var id=e.target.dataset&&e.target.dataset.n;if(!id)return;if(timers[id]){clearTimeout(timers[id]);delete timers[id];push(id)}setTimeout(function(){if(dirty)rerender()},0)});
render();

(function(){
  function load(src,ok,bad){var s=document.createElement("script");s.src=src;s.async=false;s.onload=ok;s.onerror=bad;document.head.appendChild(s)}
  function offline(){col=null;setSync("εκτός σύνδεσης 🔴 (μόνο σε αυτή τη συσκευή)")}
  var cfg={apiKey:"AIzaSyC1ycka3PNDc97b1-4z2V6OTs8LVhhcVZg",authDomain:"ergolav-6aa65.firebaseapp.com",projectId:"ergolav-6aa65",storageBucket:"ergolav-6aa65.firebasestorage.app",messagingSenderId:"522147004856",appId:"1:522147004856:web:d22e6d8b5336024d538f4d"};
  function start(){
    try{
      firebase.initializeApp(cfg);
      col=firebase.firestore().collection("calls");
      setSync("σύνδεση…");
      var first=true;
      col.onSnapshot({includeMetadataChanges:true},function(snap){
        var cache=snap.metadata.fromCache;
        var remote={};snap.docs.forEach(function(d){var v=d.data();if(v)remote[d.id]=v});
        if(first&&!cache){first=false;Object.keys(S).forEach(function(id){var x=S[id];if((x.s||x.n||x.o)&&!remote[id])push(id)})}
        Object.keys(remote).forEach(function(id){if(timers[id])return;S[id]={s:+remote[id].s||0,n:String(remote[id].n||""),o:String(remote[id].o||"")}});
        saveLocal();
        setSync(cache?"χωρίς σύνδεση, αποθηκεύεται τοπικά 🟠":"σε πραγματικό χρόνο 🟢");
        rerender();
      },function(err){
        console.error(err);
        setSync(err&&err.code==="permission-denied"?"δεν επιτρέπεται: έλεγξε τους κανόνες Firestore 🔴":"εκτός σύνδεσης 🔴");
      });
    }catch(e){console.error(e);offline()}
  }
  load("https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js",function(){
    load("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js",start,offline)
  },offline);
})();
</script>
